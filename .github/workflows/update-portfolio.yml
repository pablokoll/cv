name: Update Portfolio CV

on:
  push:
    branches:
      - master
    paths:
      - 'cv.pdf'
  workflow_dispatch:

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CV repository
        uses: actions/checkout@v4

      - name: Checkout Portfolio repository
        uses: actions/checkout@v4
        with:
          repository: pablokoll/portfolio
          token: ${{ secrets.PAT }}
          path: portfolio

      - name: Copy CV to Portfolio
        run: |
          cp cv.pdf "portfolio/public/Pablo Koll CV.pdf"

      - name: Commit and Push to Portfolio
        run: |
          cd portfolio
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "public/Pablo Koll CV.pdf"
          git commit -m "chore: update CV PDF" || echo "No changes to commit"
          git push